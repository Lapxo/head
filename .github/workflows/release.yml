name: release
on:
  workflow_run:
    workflows: [tag]
    types: [completed]
  workflow_dispatch:
concurrency: release-delivery
jobs:
  approve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.judge.outputs.tag }}
      digest: ${{ steps.judge.outputs.digest }}
      archive: ${{ steps.judge.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix .instrument --no-save --ignore-scripts @lapxo/bound@0.2.1
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags"; then
            printf 'RELEASE %s · exists\n' "$TAG"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            printf 'RELEASE %s · draft created · awaiting signed assets\n' "$TAG"
          fi
      - name: Read owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .release
          gh release download "$TAG" --pattern approval-signed --dir .release
          node .instrument/node_modules/@lapxo/bound/dist/cli/verb.js fold --as release .release/approval-signed > .release/verdict
          cat .release/verdict
      - name: Judge the approved release archive
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r status digest archive source extra < .release/verdict
          test "$status" = READY
          test -z "$extra"
          gh release download "$TAG" --pattern "$archive" --dir .release
          printf '%s  %s\n' "${digest#sha256:}" ".release/$archive" | sha256sum -c -
          expected="$(node -p "require('./package.json').name+'@'+require('./package.json').version")"
          actual="$(tar -xOf ".release/$archive" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));p.name+'@'+p.version")"
          test "$actual" = "$expected"
          printf 'SOURCE release/%s/%s · %s · declared %s\n' "$TAG" "$archive" "$digest" "$source"
          printf 'tag=%s\ndigest=%s\narchive=%s\n' "$TAG" "$digest" "$archive" >> "$GITHUB_OUTPUT"
  bundle:
    needs: approve
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.approve.outputs.tag }}
      DIGEST: ${{ needs.approve.outputs.digest }}
      ARCHIVE: ${{ needs.approve.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Make the Desktop Extension from the approved archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/release"
          printf '%s  %s\n' "${DIGEST#sha256:}" "$RUNNER_TEMP/release/$ARCHIVE" | shasum -a 256 -c -
          node .github/mcpb/build.mts "$RUNNER_TEMP/mcpb" --from "$RUNNER_TEMP/release/$ARCHIVE"
          node -e "const [a,b]=['$RUNNER_TEMP/mcpb/release.json','.github/mcpb/expected.json'].map((f)=>JSON.parse(require('fs').readFileSync(f,'utf8'))); console.log((a.digest===b.digest?'SAME     ':'DIFFERS  ')+a.digest+' here · '+b.digest+' '+b.built); process.exit(a.digest===b.digest?0:1)"
          node .github/mcpb/smoke.mts "$RUNNER_TEMP"/mcpb/head-*.mcpb "$RUNNER_TEMP/mcpb/release.json"
      - name: Attach it to the release, its digest in the notes
        run: |
          set -euo pipefail
          bundle="$(node -p "require('$RUNNER_TEMP/mcpb/release.json').bundle")"
          made="$(node -p "require('$RUNNER_TEMP/mcpb/release.json').digest")"
          gh release upload "$TAG" "$RUNNER_TEMP/mcpb/$bundle" --clobber
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if ! grep -Fq "$bundle" "$RUNNER_TEMP/notes.md"; then
            printf '\n\nDesktop Extension `%s` · `%s`, made from `%s` (`%s`), the archive the owner approved.\n' "$bundle" "$made" "$ARCHIVE" "$DIGEST" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          printf 'BUNDLE %s · %s · from %s\n' "$bundle" "$made" "$DIGEST"
  publish:
    needs: [approve, bundle]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.approve.outputs.tag }}
      DIGEST: ${{ needs.approve.outputs.digest }}
      ARCHIVE: ${{ needs.approve.outputs.archive }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@'12.1.0' --ignore-scripts
      - name: Stage the approved release archive
        run: |
          set -euo pipefail
          mkdir .release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir .release
          printf '%s  %s\n' "${DIGEST#sha256:}" ".release/$ARCHIVE" | sha256sum -c -
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          printf 'RELEASE %s · published · %s\n' "$TAG" "$DIGEST"
          npm stage publish ".release/$ARCHIVE" --access public --ignore-scripts
          printf 'STAGED %s · %s · owner approval pending\n' "$ARCHIVE" "$DIGEST"
