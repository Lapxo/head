name: release
on:
  workflow_run:
    workflows: [tag]
    types: [completed]
  workflow_dispatch:
concurrency: release-delivery
jobs:
  approve:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.judge.outputs.tag }}
      digest: ${{ steps.judge.outputs.digest }}
      archive: ${{ steps.judge.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix .instrument --no-save --ignore-scripts @lapxo/bound@0.2.1
      - name: Prepare release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$(node -p "require('./package.json').version")"
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags"; then
            printf 'RELEASE %s · exists\n' "$TAG"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
            printf 'RELEASE %s · draft created · awaiting signed assets\n' "$TAG"
          fi
      - name: Read owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir .release
          gh release download "$TAG" --pattern approval-signed --dir .release
          node .instrument/node_modules/@lapxo/bound/dist/cli/verb.js fold --as release .release/approval-signed > .release/verdict
          cat .release/verdict
      - name: Judge the approved release archive
        id: judge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r status digest archive source extra < .release/verdict
          test "$status" = READY
          test -z "$extra"
          gh release download "$TAG" --pattern "$archive" --dir .release
          printf '%s  %s\n' "${digest#sha256:}" ".release/$archive" | sha256sum -c -
          expected="$(node -p "require('./package.json').name+'@'+require('./package.json').version")"
          actual="$(tar -xOf ".release/$archive" package/package.json | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));p.name+'@'+p.version")"
          test "$actual" = "$expected"
          printf 'SOURCE release/%s/%s · %s · declared %s\n' "$TAG" "$archive" "$digest" "$source"
          printf 'tag=%s\ndigest=%s\narchive=%s\n' "$TAG" "$digest" "$archive" >> "$GITHUB_OUTPUT"
  bundle:
    needs: approve
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.approve.outputs.tag }}
      DIGEST: ${{ needs.approve.outputs.digest }}
      ARCHIVE: ${{ needs.approve.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Make the Desktop Extension from the approved archive, twice, repacked with fixed times and order, and require one digest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$TAG" --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/release"
          printf '%s  %s\n' "${DIGEST#sha256:}" "$RUNNER_TEMP/release/$ARCHIVE" | shasum -a 256 -c -
          test "v$(node -p "require('./manifest.json').version")" = "$TAG"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for n in 1 2; do
            stage="$RUNNER_TEMP/stage-$n"
            mkdir -p "$stage"
            tar -xzf "$RUNNER_TEMP/release/$ARCHIVE" -C "$stage" --strip-components 1
            cp package-lock.json manifest.json "$stage/"
            (cd "$stage" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error)
            npx --no-install mcpb pack "$stage" "$RUNNER_TEMP/packed-$n.mcpb"
            unpacked="$RUNNER_TEMP/unpacked-$n"
            mkdir -p "$unpacked"
            unzip -q "$RUNNER_TEMP/packed-$n.mcpb" -d "$unpacked"
            chmod -R u=rwX,go=rX "$unpacked"
            TZ=UTC find "$unpacked" -exec touch -h -t 198001020000 {} +
            (cd "$unpacked" && find . -type f | LC_ALL=C sort | TZ=UTC zip -X -9 -q -@ "$RUNNER_TEMP/head-$n.mcpb")
          done
          one="$(shasum -a 256 "$RUNNER_TEMP/head-1.mcpb" | cut -d' ' -f1)"
          two="$(shasum -a 256 "$RUNNER_TEMP/head-2.mcpb" | cut -d' ' -f1)"
          for n in 1 2; do printf 'CONTENT %s · %s\n' "$n" "$(cd "$RUNNER_TEMP/unpacked-$n" && find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"; done
          test "$one" = "$two"
          bundle="head-${TAG#v}-${one:0:16}.mcpb"
          cp "$RUNNER_TEMP/head-1.mcpb" "$RUNNER_TEMP/$bundle"
          printf 'BUNDLE=%s\nMADE=sha256:%s\n' "$bundle" "$one" >> "$GITHUB_ENV"
          printf 'BUNDLE %s · sha256:%s · made twice · from %s\n' "$bundle" "$one" "$DIGEST"
      - name: Run it as a host would, from the unpacked bundle in a fresh home
        run: HEAD_BUNDLE="$RUNNER_TEMP/$BUNDLE" node --test test/bundle.test.ts
      - name: Attach it to the release, its digest in the notes
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -q 'The Desktop Extension `head-' "$RUNNER_TEMP/notes.md"; then
            grep -Fq "$MADE" "$RUNNER_TEMP/notes.md" || { printf 'REFUSE·bundle the release names another digest than %s\n' "$MADE"; exit 1; }
          else
            printf '\n\nThe signature covers `%s` (`%s`). The Desktop Extension `%s` (`%s`) is made by this workflow from that archive, packed by mcpb and repacked with fixed times, modes and order; made again, it gives the same digest.\n' "$ARCHIVE" "$DIGEST" "$BUNDLE" "$MADE" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/$BUNDLE" --clobber
          mkdir -p "$RUNNER_TEMP/back"
          gh release download "$TAG" --pattern "$BUNDLE" --dir "$RUNNER_TEMP/back"
          printf '%s  %s\n' "${MADE#sha256:}" "$RUNNER_TEMP/back/$BUNDLE" | shasum -a 256 -c -
  publish:
    needs: [approve, bundle]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.approve.outputs.tag }}
      DIGEST: ${{ needs.approve.outputs.digest }}
      ARCHIVE: ${{ needs.approve.outputs.archive }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global npm@'12.1.0' --ignore-scripts
      - name: Stage the approved release archive
        run: |
          set -euo pipefail
          mkdir .release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir .release
          printf '%s  %s\n' "${DIGEST#sha256:}" ".release/$ARCHIVE" | sha256sum -c -
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          printf 'RELEASE %s · published · %s\n' "$TAG" "$DIGEST"
          npm stage publish ".release/$ARCHIVE" --access public --ignore-scripts
          printf 'STAGED %s · %s · owner approval pending\n' "$ARCHIVE" "$DIGEST"
