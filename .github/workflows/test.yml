name: check
on:
  push:
    branches: [main, 'measure/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    env:
      SHARD_1: test/doors.test.ts test/share.test.ts test/verbs.test.ts test/reuse.test.ts test/born-closed.test.ts test/reading-identity.test.ts test/numbers.test.ts test/transport.test.ts
      SHARD_2: test/act.test.ts test/channels.test.ts test/consent.test.ts test/gestures.test.ts test/claims.test.ts test/fold-ahead.test.ts test/trust.test.ts
      SHARD_3: test/marks.test.ts test/share-receive.test.ts test/authorizer.test.ts test/link-url.test.ts test/read.test.ts test/shape.test.ts test/release.test.ts test/device.test.ts test/surface.test.ts test/refusal-record.test.ts test/welcome.test.ts test/bound.test.ts test/warm-compact.test.ts test/pack.test.ts test/pending-document.test.ts test/keys.test.ts test/acts.test.ts test/bundle.test.ts test/onboarding.test.ts
      SHARD_4: test/issuer.test.ts test/fetch.test.ts test/connect.test.ts test/first-minute.test.ts test/use.test.ts test/places.test.ts test/warm.test.ts test/session.test.ts test/process.test.ts test/stores.test.ts test/signer.test.ts
      SHARD_5: test/org.test.ts test/ahead-read.test.ts test/access.test.ts test/answered.test.ts test/world.test.ts test/named.test.ts test/first-run.test.ts test/place-neutral.test.ts
      SHARD_6: test/marks-lineage.test.ts test/share-refused.test.ts test/kept-zero-moved.test.ts test/observed.test.ts test/walk.test.ts test/kept-zero.test.ts test/adopt.test.ts test/asking.test.ts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require every test file in exactly one shard
        run: diff <(printf '%s\n' $SHARD_1 $SHARD_2 $SHARD_3 $SHARD_4 $SHARD_5 $SHARD_6 | sort) <(ls test/*.test.ts | sort)
      - run: npm ci
      - run: npm run build
      - name: Run tests, shard ${{ matrix.shard }} of 6, the files listed for it
        run: |
          set -euo pipefail
          files="SHARD_${{ matrix.shard }}"
          node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/head-junit.xml" ${!files} 2>&1 | tee "$RUNNER_TEMP/head-tests.log"
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: head-node-22-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/head-tests.log
            ${{ runner.temp }}/head-junit.xml
          if-no-files-found: ignore
  walk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check the committed receipts on a clean checkout
        run: npx --no-install bound fold --check
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Pack the archive npm would publish
        run: mkdir -p "$RUNNER_TEMP/release" && npm pack --pack-destination "$RUNNER_TEMP/release"
      - name: Make the Desktop Extension from that archive, twice, repacked with fixed times and order, and require one digest
        run: |
          set -euo pipefail
          test "$(node -p "require('./manifest.json').version")" = "$(node -p "require('./package.json').version")"
          archive="$(ls "$RUNNER_TEMP"/release/*.tgz)"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          for n in 1 2; do
            stage="$RUNNER_TEMP/stage-$n"
            mkdir -p "$stage"
            tar -xzf "$archive" -C "$stage" --strip-components 1
            cp package-lock.json manifest.json .mcpbignore "$stage/"
            (cd "$stage" && npm ci --omit=dev --ignore-scripts --no-audit --no-fund --loglevel=error)
            npx --no-install mcpb pack "$stage" "$RUNNER_TEMP/packed-$n.mcpb"
            unpacked="$RUNNER_TEMP/unpacked-$n"
            mkdir -p "$unpacked"
            unzip -q "$RUNNER_TEMP/packed-$n.mcpb" -d "$unpacked"
            chmod -R u=rwX,go=rX "$unpacked"
            TZ=UTC find "$unpacked" -exec touch -h -t 198001020000 {} +
            (cd "$unpacked" && find . -type f | LC_ALL=C sort | TZ=UTC zip -X -9 -q -@ "$RUNNER_TEMP/head-$n.mcpb")
          done
          one="$(shasum -a 256 "$RUNNER_TEMP/head-1.mcpb" | cut -d' ' -f1)"
          two="$(shasum -a 256 "$RUNNER_TEMP/head-2.mcpb" | cut -d' ' -f1)"
          for n in 1 2; do printf 'CONTENT %s · %s\n' "$n" "$(cd "$RUNNER_TEMP/unpacked-$n" && find . -type f | LC_ALL=C sort | xargs shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"; done
          printf 'BUNDLE sha256:%s · made again sha256:%s · from %s\n' "$one" "$two" "$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          test "$one" = "$two"
      - name: Run it as a host would, from the unpacked bundle in a fresh home
        run: HEAD_BUNDLE="$RUNNER_TEMP/head-1.mcpb" node --test test/bundle.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: head-bundle
          path: |
            ${{ runner.temp }}/release/
            ${{ runner.temp }}/head-1.mcpb
          if-no-files-found: error
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Keep the tree this run tests, so a tag can rest on it once the pull request is merged
        run: git rev-parse "HEAD^{tree}" | tee "$RUNNER_TEMP/tested-tree"
      - uses: actions/upload-artifact@v4
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
