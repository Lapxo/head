name: Verified desktop runtime
description: Prepare only the fixed official executable and verify its bytes and original signature
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        url="$(node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("runtime.lock.json")); const u=new URL(p.package.url); if(!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(p.version)||u.origin!=="https://nodejs.org"||u.pathname!==`/dist/${p.version}/node-${p.version}.pkg`||u.search||u.hash||u.username||u.password)throw Error("runtime provenance URL"); process.stdout.write(p.package.url)')"
        version="$(node -p "require('./runtime.lock.json').version")"
        scratch="$(mktemp -d "$RUNNER_TEMP/head-runtime.XXXXXX")"
        trap 'rm -rf "$scratch"' EXIT
        archive="$scratch/node-runtime.pkg"
        curl --fail --proto '=https' --tlsv1.2 --output "$archive" "$url"
        printf '%s  %s\n' "$(node -p "require('./runtime.lock.json').package.sha256")" "$archive" | shasum -a 256 -c -
        pkgutil --check-signature "$archive"
        pkgutil --expand-full "$archive" "$scratch/expanded"
        cp "$scratch/expanded/node-$version.pkg/Payload/usr/local/bin/node" runtime/node
        chmod 755 runtime/node
        for name in executable license; do
          read -r digest path < <(node -p "const p=require('./runtime.lock.json')['$name']; p.sha256+' '+p.path")
          printf '%s  %s\n' "$digest" "$path" | shasum -a 256 -c -
        done
        for arch in arm64 x86_64; do codesign --verify --strict --arch "$arch" runtime/node; done
